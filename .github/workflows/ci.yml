name: CI - FAB ONE Integrated Verification

on:
  push:
    branches:
      - main
      - 'a02/**'
      - 'a04/**'
  pull_request:
    branches:
      - main
      - 'a02/**'
      - 'a04/**'

jobs:
  backend-test:
    name: Backend API Unit Tests (FastAPI / SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Python API unit tests
        run: python -m unittest services/api/tests/test_api.py

  web-test-and-build:
    name: Web Frontend Unit Tests & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web contract & unit tests (93 tests)
        working-directory: apps/web
        run: npm test

      - name: Build Next.js production bundle
        working-directory: apps/web
        run: npm run build

  e2e-smoke-test:
    name: Integrated Mode A & Mode B Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, web-test-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (Guided Tour & Mode B Connected Investigation)
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
